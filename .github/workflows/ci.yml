name: CI

on:
  pull_request:
  push:
    tags: ["v*"]  # a version tag publishes a release (last step)
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write  # to create a release when a version tag is pushed
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            build_scripts/requirements_build.txt

      - name: Install requirements
        run: pip install -r build_scripts/requirements_build.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      # The same script a developer runs, so the two cannot drift apart.
      - name: Build executable
        working-directory: build_scripts
        shell: cmd
        run: build.bat

      # A windowed program has no console, so a library missing from the
      # build would otherwise only show up as a window that never opens.
      - name: Check the executable starts and can load every library
        shell: pwsh
        run: |
          $process = Start-Process dist\ReMInD.exe -ArgumentList "--check", "check.log" -Wait -PassThru
          Get-Content check.log
          exit $process.ExitCode

      - uses: actions/upload-artifact@v7
        with:
          name: ReMInD-windows
          path: dist/ReMInD.exe

      # Pushing a tag such as v4.0.0 publishes a release with the executable
      # that was just built and checked.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = python -c "import sys; sys.path.insert(0, 'src'); from version import VERSION; print(VERSION)"
          if ("v$version" -ne $env:GITHUB_REF_NAME) {
            Write-Error "The tag $env:GITHUB_REF_NAME does not match version $version in src/version.py"
            exit 1
          }
          gh release create $env:GITHUB_REF_NAME dist/ReMInD.exe --title "ReMInD $version" --generate-notes

  # Temporary: measures how long the executable takes to show its window.
  measure:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          ref: main
          path: old
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build the three variants
        shell: cmd
        run: |
          pip install -r build_scripts/requirements_build.txt || exit /b 1
          pyinstaller --onefile --windowed --name ReMInD --noconfirm --distpath out/new-onefile --workpath w1 --icon ReMInD.ico --add-data "ReMInD.ico;." src/remind.py || exit /b 1
          pyinstaller --onedir --windowed --name ReMInD --noconfirm --distpath out/new-onedir --workpath w2 --icon ReMInD.ico --add-data "ReMInD.ico;." src/remind.py || exit /b 1
          pip install -r old/build_scripts/requirements_build.txt || exit /b 1
          pyinstaller --onefile --windowed --name ReMInD --noconfirm --distpath out/old-onefile --workpath w3 --add-data "old/src/metadata_extractors;metadata_extractors" --collect-all ome_types --collect-all xsdata --collect-all xsdata_pydantic_basemodel old/src/remind.py || exit /b 1

      - name: Time from launch to window
        shell: pwsh
        run: |
          function Measure-Startup($exe) {
            $watch = [Diagnostics.Stopwatch]::StartNew()
            Start-Process $exe
            # A one-file build runs the program in a child process, so the
            # window is looked for by title rather than on the started process.
            while (-not (Get-Process | Where-Object { $_.MainWindowTitle -like "*ReMInD*" }) -and $watch.Elapsed.TotalSeconds -lt 120) {
              Start-Sleep -Milliseconds 20
            }
            $seconds = [math]::Round($watch.Elapsed.TotalSeconds, 2)
            Get-Process ReMInD -ErrorAction SilentlyContinue | Stop-Process -Force
            Start-Sleep -Seconds 2
            return $seconds
          }
          $variants = [ordered]@{
            "main, one file"         = "out/old-onefile/ReMInD.exe"
            "this branch, one file"  = "out/new-onefile/ReMInD.exe"
            "this branch, folder"    = "out/new-onedir/ReMInD/ReMInD.exe"
          }
          foreach ($name in $variants.Keys) {
            $size = if ($name -like "*folder") { (Get-ChildItem out/new-onedir -Recurse | Measure-Object Length -Sum).Sum } else { (Get-Item $variants[$name]).Length }
            $times = 1..5 | ForEach-Object { Measure-Startup $variants[$name] }
            Write-Output ("RESULT {0}: {1} MB, startup seconds: {2}" -f $name, [math]::Round($size / 1MB, 1), ($times -join ", "))
          }
