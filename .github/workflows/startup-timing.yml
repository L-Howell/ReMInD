# Temporary: measures how long the executable takes to show its window.
name: Startup timing

on:
  workflow_dispatch:

jobs:
  measure:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          ref: main
          path: old
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build the three variants
        shell: cmd
        run: |
          pip install -r build_scripts/requirements_build.txt || exit /b 1
          pyinstaller --onefile --windowed --name ReMInD --noconfirm --distpath out/new-onefile --workpath w1 --icon ReMInD.ico --add-data "ReMInD.ico;." src/remind.py || exit /b 1
          pyinstaller --onedir --windowed --name ReMInD --noconfirm --distpath out/new-onedir --workpath w2 --icon ReMInD.ico --add-data "ReMInD.ico;." src/remind.py || exit /b 1
          pip install -r old/build_scripts/requirements_build.txt || exit /b 1
          pyinstaller --onefile --windowed --name ReMInD --noconfirm --distpath out/old-onefile --workpath w3 --add-data "old/src/metadata_extractors;metadata_extractors" --collect-all ome_types --collect-all xsdata --collect-all xsdata_pydantic_basemodel old/src/remind.py || exit /b 1

      - name: Time from launch to window
        shell: pwsh
        run: |
          function Measure-Startup($exe) {
            $watch = [Diagnostics.Stopwatch]::StartNew()
            Start-Process $exe
            # A one-file build runs the program in a child process, so the
            # window is looked for by title rather than on the started process.
            while (-not (Get-Process | Where-Object { $_.MainWindowTitle -like "*ReMInD*" }) -and $watch.Elapsed.TotalSeconds -lt 120) {
              Start-Sleep -Milliseconds 20
            }
            $seconds = [math]::Round($watch.Elapsed.TotalSeconds, 2)
            Get-Process ReMInD -ErrorAction SilentlyContinue | Stop-Process -Force
            Start-Sleep -Seconds 2
            return $seconds
          }
          $variants = [ordered]@{
            "main, one file"         = "out/old-onefile/ReMInD.exe"
            "this branch, one file"  = "out/new-onefile/ReMInD.exe"
            "this branch, folder"    = "out/new-onedir/ReMInD/ReMInD.exe"
          }
          foreach ($name in $variants.Keys) {
            $size = if ($name -like "*folder") { (Get-ChildItem out/new-onedir -Recurse | Measure-Object Length -Sum).Sum } else { (Get-Item $variants[$name]).Length }
            $times = 1..5 | ForEach-Object { Measure-Startup $variants[$name] }
            Write-Output ("RESULT {0}: {1} MB, startup seconds: {2}" -f $name, [math]::Round($size / 1MB, 1), ($times -join ", "))
          }
